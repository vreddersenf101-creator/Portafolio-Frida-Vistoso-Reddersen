<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <title>Trinky Wallet | Iniciar sesión</title>
</head>

<body>
  <div class="wallet-page d-flex align-items-center justify-content-center">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="login-card">
            <h1 class="text-center mb-4">Trinky Wallet</h1>

            <form id="loginForm">
              <div class="form-group">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" class="form-control" placeholder="tucorreo@ejemplo.com">
              </div>
              <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" class="form-control" placeholder="Ingresa tu contraseña">
              </div>
              <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
            </form>

            
            <div id="alert-container" class="mt-3"></div>

            <p class="hint text-center mt-3">
              Cuenta de prueba: <strong>admin@trinky.cl</strong> / Clave: <strong>12345</strong>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/jquery-3.6.0.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/login.js"></script>
<div style="padding:16px;text-align:center"><a href="https://github.com/vreddersenf101-creator/alke-wallet" style="color:inherit;text-decoration:underline">Repositorio en GitHub ↗</a></div></body>

</html>
