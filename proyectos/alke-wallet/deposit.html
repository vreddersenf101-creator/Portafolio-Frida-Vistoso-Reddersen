<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <title>Trinky Wallet | Depositar</title>
</head>

<body>
  <div class="wallet-page">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="wallet-card">
            <a href="menu.html" class="back-link">&larr; Volver al menú</a>
            <h1 class="mb-4">Depositar</h1>

            <p class="balance-label">Saldo actual</p>
            <p id="saldoActual" class="balance-amount">$0</p>

            <form id="depositForm" class="mt-4">
              <div class="form-group">
                <label for="amount">Monto a depositar:</label>
                <input type="number" id="amount" class="form-control" placeholder="0" min="1" step="1" required>
              </div>
              <button type="submit" class="btn btn-primary btn-block">Depositar</button>
            </form>

            <p id="depositedMsg" class="mt-3"></p>

            
            <div id="alert-container" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/jquery-3.6.0.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/deposit.js"></script>
<div style="padding:16px;text-align:center"><a href="https://github.com/vreddersenf101-creator/alke-wallet" style="color:inherit;text-decoration:underline">Repositorio en GitHub ↗</a></div></body>

</html>
